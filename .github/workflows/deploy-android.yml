name: Build and publish Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Godot and export templates
        env:
          GODOT_VERSION: 4.7.2
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/export-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          ln -sf "$RUNNER_TEMP/godot/Godot_v${release}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${release}/Godot_v${release}_export_templates.tpz" -o "$RUNNER_TEMP/export-templates.tpz"
          unzip -q "$RUNNER_TEMP/export-templates.tpz" -d "$RUNNER_TEMP/export-templates"
          cp -R "$RUNNER_TEMP/export-templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Android paths for Godot
        env:
          GODOT_VERSION: 4.7.2
        run: |
          mkdir -p "$HOME/.config/godot"
          editor_settings_version="${GODOT_VERSION%.*}"
          cat > "$HOME/.config/godot/editor_settings-${editor_settings_version}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/PES_DreamFactory.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PES_DreamFactory-android
          path: build/android/PES_DreamFactory.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" build/android/PES_DreamFactory.apk --title "$RELEASE_TAG" --generate-notes
